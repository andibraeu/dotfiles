# NOTE: The images directory is not included in the dotfiles repository.
# You need to manually create ~/.config/hypr/images/ and add your wallpaper images,
# or adjust the paths below to point to your desired wallpaper locations.

splash = false

wallpaper {
    monitor = eDP-1
    path = ~/.config/hypr/images/P1000824.JPG
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = ~/.config/hypr/images/photo_2022-12-09_10-26-47.jpg
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-2
    path = ~/.config/hypr/images/photo_2022-12-09_10-26-47.jpg
    fit_mode = cover
}

