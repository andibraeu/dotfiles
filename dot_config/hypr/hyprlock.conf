# hyprlock – an den SDDM-Greeter (SilentSDDM, Preset "nord") angeglichen
#
# Nord-Palette:
#   bg      #1f232b   surface #242933   text   #d8dee9
#   accent  #81a1c1   warn    #ebcb8b   error  #bf616a   caps #d08770

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    # NOTE: The lockscreen image is not included in the dotfiles repository.
    # You need to manually create ~/.config/hypr/images/lockscreen/ and add your lockscreen image,
    # or adjust the path below to point to your desired lockscreen background.
    # Wird per Cron alle 10 min neu verlinkt; SDDM nutzt dasselbe Bild.
    path = ~/.config/hypr/images/lockscreen/lockscreen # supports png, jpg, webp (no animations, though)
    color = rgb(1f232b)

    blur_passes = 0 # 0 = scharf wie der SDDM-Lockscreen; z.B. 3 für Weichzeichner
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Uhr
label {
    monitor =
    text = $TIME
    color = rgb(d8dee9)
    font_size = 90
    font_family = Red Hat Display Black
    shadow_passes = 2
    shadow_size = 4

    position = 0, 160
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %-d. %B %Y"
    color = rgb(d8dee9)
    font_size = 16
    font_family = Red Hat Display SemiBold
    shadow_passes = 2
    shadow_size = 3

    position = 0, 85
    halign = center
    valign = center
}

# Benutzername
label {
    monitor =
    text = $USER
    color = rgb(d8dee9)
    font_size = 16
    font_family = Red Hat Display Bold
    shadow_passes = 2
    shadow_size = 3

    position = 0, -5
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    rounding = 10

    outer_color = rgba(129, 161, 193, 0.0) # unsichtbarer Rand im Ruhezustand
    inner_color = rgba(36, 41, 51, 0.85)    # #242933
    font_color = rgb(d8dee9)
    font_family = Red Hat Display

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <i>Passwort …</i>
    hide_input = false

    check_color = rgb(81a1c1)  # Prüfen läuft → Nord-Blau
    fail_color = rgb(bf616a)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(d08770)
    numlock_color = -1
    bothlock_color = -1
    swap_font_color = false

    position = 0, -60
    halign = center
    valign = center
}

# Hinweis bei Feststelltaste
label {
    monitor =
    text = cmd[update:500] grep -qs 1 /sys/class/leds/*capslock*/brightness && echo "Feststelltaste aktiv" || echo ""
    color = rgb(d08770)
    font_size = 11
    font_family = Red Hat Display

    position = 0, -105
    halign = center
    valign = center
}
